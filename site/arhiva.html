<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arhiva — Mondialul de dimineață</title>
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var l = localStorage.getItem('lang');
      document.documentElement.lang = (l === 'ro' || l === 'en') ? l : 'ro';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css" />
  <script data-goatcounter="https://mondialul.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="meta">
    <span>Arhiva dimineților</span>
    <span><a href="index.html" style="color: var(--muted);">← azi</a></span>
  </div>
  <main id="app">
    <div class="card">
      <p class="card-label">Alege o dimineață</p>
      <ul class="archive-list" id="archive-list">
        <li class="empty-state">Se încarcă…</li>
      </ul>
    </div>
    <div id="digest"></div>
  </main>
  <footer style="margin-top: 2rem; text-align: center; font-size: 12px; color: var(--muted);">
    Folosim GoatCounter pentru statistici anonime de vizitare (fără cookie-uri).
  </footer>
  <script type="module">
    import { renderDigest, loadDigest } from './assets/render.js';
    import { mountToggle } from './assets/theme.js';
    import { mountLangToggle, currentLang } from './assets/lang.js';

    const meta = document.querySelector('.meta');
    mountToggle(meta);

    const list = document.getElementById('archive-list');
    const digestRoot = document.getElementById('digest');
    let shownDate = null;
    let shownDigest = null;

    mountLangToggle(meta, () => {
      if (shownDigest) renderDigest(digestRoot, shownDigest, currentLang());
    });

    const dateFmt = new Intl.DateTimeFormat('ro-RO', {
      timeZone: 'Europe/Bucharest', weekday: 'long', day: 'numeric', month: 'long',
    });

    async function showDay(date) {
      try {
        const digest = await loadDigest(`data/${date}.json`);
        shownDate = date;
        shownDigest = digest;
        renderDigest(digestRoot, digest, currentLang());
        digestRoot.scrollIntoView({ behavior: 'smooth' });
      } catch {
        digestRoot.replaceChildren(Object.assign(document.createElement('p'), {
          className: 'empty-state',
          textContent: `Nu există digest pentru ${date}.`,
        }));
      }
    }

    try {
      const manifest = await loadDigest('data/manifest.json');
      list.replaceChildren();
      for (const date of [...manifest.dates].sort().reverse()) {
        const link = document.createElement('a');
        link.href = `#${date}`;
        link.textContent = dateFmt.format(new Date(`${date}T06:00:00Z`));
        link.addEventListener('click', (event) => {
          event.preventDefault();
          history.replaceState(null, '', `#${date}`);
          showDay(date);
        });
        const item = document.createElement('li');
        item.append(link);
        if (manifest.recaps?.[date]) {
          const mark = document.createElement('span');
          mark.className = 'archive-recaps';
          const count = manifest.recaps[date];
          mark.textContent = '▶ rezumate';
          mark.title = count === 1 ? '1 rezumat video' : `${count} rezumate video`;
          item.append(mark);
        }
        list.append(item);
      }
      if (location.hash) showDay(location.hash.slice(1));
    } catch {
      list.replaceChildren(Object.assign(document.createElement('li'), {
        className: 'empty-state',
        textContent: 'Arhiva e încă goală.',
      }));
    }
  </script>
</body>
</html>
