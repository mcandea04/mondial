<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arhiva — Mondialul de dimineață</title>
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var l = localStorage.getItem('lang');
      document.documentElement.lang = (l === 'ro' || l === 'en') ? l : 'ro';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css" />
  <script data-goatcounter="https://mondialul.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <div class="meta">
    <span id="archive-title">Arhiva dimineților</span>
    <span><a href="index.html" id="back-today" style="color: var(--muted);">← azi</a></span>
  </div>
  <main id="app">
    <div class="card">
      <p class="card-label" id="choose-day">Alege o dimineață</p>
      <ul class="archive-list" id="archive-list">
        <li class="empty-state">Se încarcă…</li>
      </ul>
    </div>
    <div id="digest"></div>
  </main>
  <footer style="margin-top: 2rem; text-align: center; font-size: 12px; color: var(--muted);">
    Folosim GoatCounter pentru statistici anonime de vizitare (fără cookie-uri).
  </footer>
  <script type="module">
    import { renderDigest, loadDigest } from './assets/render.js';
    import { mountToggle } from './assets/theme.js';
    import { mountLangToggle, currentLang } from './assets/lang.js';
    import { UI_STRINGS, dateLabel } from './assets/i18n.js';

    const meta = document.querySelector('.meta');
    mountToggle(meta);

    const list = document.getElementById('archive-list');
    const digestRoot = document.getElementById('digest');
    let shownDate = null;
    let shownDigest = null;
    let manifest = null;

    // Re-applies every language-dependent label on the page for the active
    // language: the static chrome, the archive day list, and the shown digest.
    function applyLang() {
      const lang = currentLang();
      const t = UI_STRINGS[lang];
      document.getElementById('archive-title').textContent = t.archiveTitle;
      document.getElementById('back-today').textContent = t.backToday;
      document.getElementById('choose-day').textContent = t.chooseDay;
      if (manifest) renderList(lang);
      if (shownDigest) renderDigest(digestRoot, shownDigest, lang);
    }

    mountLangToggle(meta, applyLang);

    function renderList(lang) {
      const t = UI_STRINGS[lang];
      list.replaceChildren();
      for (const date of [...manifest.dates].sort().reverse()) {
        const link = document.createElement('a');
        link.href = `#${date}`;
        link.textContent = dateLabel(date, lang);
        link.addEventListener('click', (event) => {
          event.preventDefault();
          history.replaceState(null, '', `#${date}`);
          showDay(date);
        });
        const item = document.createElement('li');
        item.append(link);
        if (manifest.recaps?.[date]) {
          const mark = document.createElement('span');
          mark.className = 'archive-recaps';
          mark.textContent = t.recaps;
          mark.title = t.recapsTitle(manifest.recaps[date]);
          item.append(mark);
        }
        list.append(item);
      }
    }

    async function showDay(date) {
      try {
        const digest = await loadDigest(`data/${date}.json`);
        shownDate = date;
        shownDigest = digest;
        renderDigest(digestRoot, digest, currentLang());
        digestRoot.scrollIntoView({ behavior: 'smooth' });
      } catch {
        digestRoot.replaceChildren(Object.assign(document.createElement('p'), {
          className: 'empty-state',
          textContent: UI_STRINGS[currentLang()].noDigest(date),
        }));
      }
    }

    try {
      manifest = await loadDigest('data/manifest.json');
      renderList(currentLang());
      if (location.hash) showDay(location.hash.slice(1));
    } catch {
      list.replaceChildren(Object.assign(document.createElement('li'), {
        className: 'empty-state',
        textContent: UI_STRINGS[currentLang()].emptyArchive,
      }));
    }
  </script>
</body>
</html>
