<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mondialul de dimineață</title>
  <!-- og:start -->
  <meta property="og:title" content="Eficiență spaniolă de speriat și Franța rămâne fără replică" />
  <meta property="og:description" content="Spania se califică în finală după ce a învins Franța cu 2-0, grație golurilor marcate de Oyarzabal și Pedro Porro. Nici Caracatița Paul n-ar fi ghicit că ibericii vor înscrie la singurele lor două șuturi pe poartă, în timp ce francezii părăsesc turneul cu zece tentative și nicio intervenție din partea propriului goalkeeper." />
  <meta property="og:image" content="https://mcandea04.github.io/mondial/data/og/2026-07-15.png" />
  <meta property="og:url" content="https://mcandea04.github.io/mondial/" />
  <meta property="og:type" content="website" />
  <!-- og:end -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
      var l = localStorage.getItem('lang');
      document.documentElement.lang = (l === 'ro' || l === 'en') ? l : 'ro';
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css" />
  <script data-goatcounter="https://mondialul.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="app">
    <p class="empty-state">Se încarcă…</p>
  </main>
  <p style="margin-top: 1rem; text-align: center;">
    <a href="arhiva.html" style="font-size: 13px; color: var(--muted);">Arhiva dimineților →</a>
  </p>
  <footer style="margin-top: 2rem; text-align: center; font-size: 12px; color: var(--muted);">
    Folosim GoatCounter pentru statistici anonime de vizitare (fără cookie-uri).
  </footer>
  <script type="module">
    import { mountToggle } from './assets/theme.js';
    import { mountLangToggle, currentLang } from './assets/lang.js';
    import { renderDigest, loadDigest } from './assets/render.js';
    import { UI_STRINGS } from './assets/i18n.js';

    const topbar = document.getElementById('topbar');

    const app = document.getElementById('app');
    let currentDigest = null;
    let loadError = null;

    function showError(lang) {
      app.replaceChildren(Object.assign(document.createElement('p'), {
        className: 'empty-state',
        textContent: UI_STRINGS[lang].notReady(loadError.message),
      }));
    }

    mountLangToggle(topbar, (lang) => {
      if (currentDigest) renderDigest(app, currentDigest, lang);
      else if (loadError) showError(lang);
    });
    mountToggle(topbar);

    loadDigest('data/latest.json')
      .then((digest) => {
        currentDigest = digest;
        renderDigest(app, digest, currentLang());
      })
      .catch((error) => {
        loadError = error;
        showError(currentLang());
      });
  </script>
</body>
</html>
