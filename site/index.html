<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mondialul de dimineață</title>
  <!-- og:start -->
  <meta property="og:title" content="Mexic și-a pus sombrero-ul de gală, cehii au rămas în offside" />
  <meta property="og:description" content="Mexic a rezolvat debutul cu Africa de Sud fără să transpire prea tare, în timp ce Coreea de Sud a trimis Cehia la culcare cu o înfrângere la limită. Grupa A are deja un contur clar, cu gazdele și asiaticii instalându-se comod la conducere după prima rundă." />
  <meta property="og:image" content="https://mcandea04.github.io/mondial/data/og/2026-06-12.png" />
  <meta property="og:url" content="https://mcandea04.github.io/mondial/" />
  <meta property="og:type" content="website" />
  <!-- og:end -->
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <main id="app">
    <p class="empty-state">Se încarcă…</p>
  </main>
  <p style="margin-top: 1rem; text-align: center;">
    <a href="arhiva.html" style="font-size: 13px; color: var(--muted);">Arhiva dimineților →</a>
  </p>
  <script type="module">
    import { renderDigest, loadDigest } from './assets/render.js';
    const app = document.getElementById('app');
    loadDigest('data/latest.json')
      .then((digest) => renderDigest(app, digest))
      .catch((error) => {
        app.replaceChildren();
        app.append(Object.assign(document.createElement('p'), {
          className: 'empty-state',
          textContent: `Digestul de azi nu e încă gata. (${error.message})`,
        }));
      });
  </script>
</body>
</html>
