<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mondialul de dimineață</title>
  <!-- og:start -->
  <meta property="og:title" content="Șapte la Germania, un punct furat de Japonia în minutul 89" />
  <meta property="og:description" content="Germania a turnat șapte peste Curaçao, iar Suedia a făcut instrucție cu Tunisia, 5-1 — favoritele și-au văzut de treabă fără emoții. Japonia a egalat la Olanda în minutul 89 și Amad Diallo a adus Coasta de Fildeș la trei puncte în ultimul moment, două lovituri date pe ultima sută." />
  <meta property="og:image" content="https://mcandea04.github.io/mondial/data/og/2026-06-15.png" />
  <meta property="og:url" content="https://mcandea04.github.io/mondial/" />
  <meta property="og:type" content="website" />
  <!-- og:end -->
  <script>
    try {
      var t = localStorage.getItem('theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
  <link rel="stylesheet" href="assets/style.css" />
  <script data-goatcounter="https://mondialul.goatcounter.com/count"
          async src="//gc.zgo.at/count.js"></script>
</head>
<body>
  <header class="topbar" id="topbar"></header>
  <main id="app">
    <p class="empty-state">Se încarcă…</p>
  </main>
  <p style="margin-top: 1rem; text-align: center;">
    <a href="arhiva.html" style="font-size: 13px; color: var(--muted);">Arhiva dimineților →</a>
  </p>
  <footer style="margin-top: 2rem; text-align: center; font-size: 12px; color: var(--muted);">
    Folosim GoatCounter pentru statistici anonime de vizitare (fără cookie-uri).
  </footer>
  <script type="module">
    import { mountToggle } from './assets/theme.js';
    mountToggle(document.getElementById('topbar'));
  </script>
  <script type="module">
    import { renderDigest, loadDigest } from './assets/render.js';
    const app = document.getElementById('app');
    loadDigest('data/latest.json')
      .then((digest) => renderDigest(app, digest))
      .catch((error) => {
        app.replaceChildren();
        app.append(Object.assign(document.createElement('p'), {
          className: 'empty-state',
          textContent: `Digestul de azi nu e încă gata. (${error.message})`,
        }));
      });
  </script>
</body>
</html>
