name: Tests

# Runs the unit suite on every pull request. The repo has no other PR check, so
# this is the merge gate: a regression in the pipeline (standings math, scenario
# engine, narration contract, ...) fails here instead of reaching the live site.

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm test
