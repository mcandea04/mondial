name: Freshness alarm

# Dead-man switch. Every trigger path for the digest (the cron-job.org pinger and
# GitHub's own schedule cron) can fail silently, and the only symptom is that no
# new digest appears. This runs after the night window has fully closed and emails
# an alarm when the committed latest.json is not today's, so a total failure is
# noticed instead of discovered by chance.
on:
  schedule:
    # 12:00 UTC = 15:00 EEST, two hours after the digest window's morning tail
    # (10:00 UTC) closes. Late enough that a healthy night is always published.
    - cron: "0 12 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - id: fresh
        run: node scripts/check-digest-fresh.js

      - name: Email stale alarm
        if: failure() && steps.fresh.conclusion == 'failure'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Mondial <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "⚠️ Mondial — digestul de azi nu a apărut"
          body: |
            Verificarea de prospețime a eșuat: site/data/latest.json nu are data de azi.

            Niciun trigger nu a publicat digestul nopții (pinger cron-job.org sau cron-ul GitHub).
            Verifică: https://github.com/mcandea04/mondial/actions

            Publică manual: declanșează „Daily digest" din Actions.
