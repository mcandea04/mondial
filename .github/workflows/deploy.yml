name: Deploy site

# Deploys the committed site/ directory to GitHub Pages without running the
# digest pipeline. Use after a manual content edit or a restore, when the data
# is already correct in git and re-narrating would change (or lose) it.

on:
  workflow_dispatch:

permissions:
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
