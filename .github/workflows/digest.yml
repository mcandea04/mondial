name: Daily digest

on:
  schedule:
    # Poll every 15 min from 00:00 EEST (21:00 UTC) through 13:00 EEST (10:00
    # UTC). No night finishes before midnight EEST, so earlier polling can never
    # publish; the morning tail covers matches that kick off near 06:00 UTC and
    # only flip to FINISHED hours later (extra time, penalties, API lag). The run
    # is a cheap no-op until every match of the night has finished. GitHub
    # frequently drops these scheduled triggers, so a local launchd poller
    # (scripts/poll-digest.sh) fires the same workflow as the reliable path; this
    # cron is the cloud-side fallback for when that machine is asleep.
    - cron: "*/15 21-23 * * *"
    - cron: "*/15 0-10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the night's matches are not all finished"
        type: boolean
        default: false
      steer:
        description: "One-shot steering note for the narration (optional)"
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # GitHub forces Node 24 action runtimes from 2026-06-16 (mid-tournament);
      # opt in now so the switch is already verified.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Opus narrator (NARRATOR=opus) shells out to `claude -p`, which spends
      # the Pro subscription via CLAUDE_CODE_OAUTH_TOKEN. Cache the global install
      # keyed on the pinned version so a green run does not reinstall it. Skipped
      # for free when NARRATOR is unset/gemini — the install is cheap either way.
      - uses: actions/cache@v4
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}
      - name: Install Claude Code CLI
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/claude" ]; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi
        env:
          CLAUDE_CODE_VERSION: 2.1.177

      - name: Build digest
        id: build
        # Scheduled polls gate on completeness; a manual run without "force"
        # gates too, but force=true (re-run / backfill) skips the gate.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            node pipeline/run.js --re-narrate --steer "$STEER"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            node pipeline/run.js --require-complete --steer "$STEER"
          fi
        env:
          STEER: ${{ inputs.steer }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Unset by default so narrate.js DEFAULT_MODEL stays the single source of
          # truth; set the GEMINI_MODEL repo variable only to override it.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # NARRATOR is a repo *variable* so the engine is flipped from the
          # GitHub settings UI without editing this file. Values:
          #   gemini-polish — Gemini draft -> idiom critique -> rewrite (intended
          #                   production default; set the repo variable to this).
          #   unset/gemini  — Gemini single-pass.
          #   opus/opus-polish — headless Claude (needs the OAuth token below).
          # Every Gemini path rides the primary->2.5-flash fallback ladder in
          # narrate.js, so a preview-model outage degrades, never fails the night.
          NARRATOR: ${{ vars.NARRATOR }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_URL: https://mcandea04.github.io/mondial/

      - name: Commit digest data
        id: commit
        if: steps.build.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "digest: ${{ steps.build.outputs.date }}"
            git pull --rebase origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.published == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.published == 'true'
        with:
          path: site

      # GitHub Pages deployment occasionally returns a transient 504 on the
      # create call (server-side, self-heals). The commit has already landed by
      # this point, so a failed deploy would leave the site stale until the next
      # nightly run. Attempt once, and on failure wait and try a second time.
      - id: deployment
        if: steps.build.outputs.published == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before deploy retry
        if: steps.build.outputs.published == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.build.outputs.published == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Email digest ready
        # Only when fresh prose was generated — not on a highlight-link or
        # stats-only update, which still commit + deploy but carry reused prose.
        if: steps.commit.outputs.committed == 'true' && steps.build.outputs.narrationChanged == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Mondial <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "⚽ Mondialul de dimineață — ${{ steps.build.outputs.date }}"
          body: |
            ${{ steps.build.outputs.headline }}

            ${{ steps.build.outputs.match_count }} meciuri azi-noapte.

            Citește digestul: https://mcandea04.github.io/mondial/

            Nu-ți place proza? Regenerează: https://github.com/mcandea04/mondial/issues/new?title=re-narrate&labels=re-narrate&body=%3C%21--%20scrie%20aici%2C%20op%C8%9Bional%2C%20ce%20vrei%20schimbat%20la%20ton%20sau%20glume%20--%3E

            ---
            Proză: ${{ steps.build.outputs.narrator }} (dacă scrie „gemini-fallback", tokenul Opus a expirat — rulează din nou claude setup-token și actualizează secretul CLAUDE_CODE_OAUTH_TOKEN)
