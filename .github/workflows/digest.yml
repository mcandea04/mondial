name: Daily digest

on:
  schedule:
    # Poll every 15 min from 00:00 EEST (21:00 UTC) through 13:00 EEST (10:00
    # UTC). No night finishes before midnight EEST, so earlier polling can never
    # publish; the morning tail covers matches that kick off near 06:00 UTC and
    # only flip to FINISHED hours later (extra time, penalties, API lag). The run
    # is a cheap no-op until every match of the night has finished. GitHub
    # frequently drops these scheduled triggers, so a local launchd poller
    # (scripts/poll-digest.sh) fires the same workflow as the reliable path; this
    # cron is the cloud-side fallback for when that machine is asleep.
    - cron: "*/15 21-23 * * *"
    - cron: "*/15 0-10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the night's matches are not all finished"
        type: boolean
        default: false
      steer:
        description: "One-shot steering note for the narration (optional)"
        type: string
        default: ""
      date:
        description: "Override date (YYYY-MM-DD). Defaults to last night."
        type: string
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # GitHub forces Node 24 action runtimes from 2026-06-16 (mid-tournament);
      # opt in now so the switch is already verified.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # The Opus narrator (NARRATOR=opus) shells out to `claude -p`, which spends
      # the Pro subscription via CLAUDE_CODE_OAUTH_TOKEN. Cache the global install
      # keyed on the pinned version so a green run does not reinstall it. Skipped
      # for free when NARRATOR is unset/gemini — the install is cheap either way.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.npm-global
          key: claude-code-${{ env.CLAUDE_CODE_VERSION }}
      - name: Install Claude Code CLI
        run: |
          npm config set prefix "$HOME/.npm-global"
          echo "$HOME/.npm-global/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/.npm-global/bin/claude" ]; then
            npm install -g "@anthropic-ai/claude-code@${CLAUDE_CODE_VERSION}"
          fi
        env:
          CLAUDE_CODE_VERSION: 2.1.177

      - name: Build digest
        id: build
        # Scheduled polls gate on completeness; a manual run without "force"
        # gates too, but force=true (re-run / backfill) skips the gate.
        run: |
          DATE_ARG=""
          if [ -n "${{ inputs.date }}" ]; then DATE_ARG="--date ${{ inputs.date }}"; fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            node pipeline/run.js --re-narrate --steer "$STEER" $DATE_ARG
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            node pipeline/run.js --require-complete --steer "$STEER" $DATE_ARG
          fi
        env:
          STEER: ${{ inputs.steer }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Unset by default so narrate.js DEFAULT_MODEL stays the single source of
          # truth; set the GEMINI_MODEL repo variable only to override it.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          # NARRATOR is a repo *variable* so the engine is flipped from the
          # GitHub settings UI without editing this file. Values:
          #   gemini-polish — Gemini draft -> idiom critique -> rewrite (intended
          #                   production default; set the repo variable to this).
          #   unset/gemini  — Gemini single-pass.
          #   opus/opus-polish — headless Claude (needs the OAuth token below).
          # Every Gemini path rides the primary->2.5-flash fallback ladder in
          # narrate.js, so a preview-model outage degrades, never fails the night.
          NARRATOR: ${{ vars.NARRATOR }}
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          SITE_URL: https://mcandea04.github.io/mondial/

      - name: Commit digest data
        id: commit
        if: steps.build.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "digest: ${{ steps.build.outputs.date }}"
            # A concurrent digest run can push the same day's regenerated files
            # while this one was still narrating. The rebase then hits add/add
            # conflicts on today's data, which means the other run already
            # published this day -- our work is redundant, not broken. Treat that
            # as a clean no-op (skip deploy/email) instead of a red failure.
            if ! git pull --rebase origin main; then
              git rebase --abort
              echo "Concurrent run already published this day; skipping push."
              echo "committed=false" >> "$GITHUB_OUTPUT"
            else
              git push
              echo "committed=true" >> "$GITHUB_OUTPUT"
            fi
          fi

      # Deploy only what was actually pushed. On a graceful race-abort the local
      # site/ holds this run's regenerated files that lost the race and were not
      # pushed; deploying them would put race-loser content live. Gating on
      # committed also skips a redundant re-deploy when there was nothing to
      # commit (the winning run already deployed the identical site).
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        if: steps.commit.outputs.committed == 'true'

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        if: steps.commit.outputs.committed == 'true'
        with:
          path: site

      # GitHub Pages deployment occasionally returns a transient 504 on the
      # create call (server-side, self-heals). The commit has already landed by
      # this point, so a failed deploy would leave the site stale until the next
      # nightly run. Attempt once, and on failure wait and try a second time.
      - id: deployment
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Wait before deploy retry
        if: steps.commit.outputs.committed == 'true' && steps.deployment.outcome == 'failure'
        run: sleep 30

      - id: deployment_retry
        if: steps.commit.outputs.committed == 'true' && steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Email digest ready
        # Nightly: only when fresh prose was generated — not on a highlight-link
        # or stats-only update, which still commit + deploy but carry reused prose.
        # Forced (re-narrate/gold) run: always email, even with no change, so the
        # owner gets confirmation.
        if: >
          steps.build.outputs.published == 'true' &&
          ((steps.commit.outputs.committed == 'true' && steps.build.outputs.narrationChanged == 'true') ||
           (github.event_name == 'workflow_dispatch' && inputs.force == 'true'))
        uses: dawidd6/action-send-mail@4226df7daafa6fc901a43789c49bf7ab309066e7 # v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Mondial <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "⚽ Mondialul de dimineață — ${{ steps.build.outputs.date }}"
          body: |
            ${{ steps.build.outputs.headline }}

            ${{ steps.build.outputs.match_count }} meciuri azi-noapte.${{ steps.commit.outputs.committed == 'true' && ' ' || ' (regenerat, proza neschimbată) ' }}

            Citește digestul: https://mcandea04.github.io/mondial/

            Nu-ți place proza? Regenerează: https://github.com/mcandea04/mondial/issues/new?title=re-narrate&labels=re-narrate&body=%3C%21--%20scrie%20aici%2C%20op%C8%9Bional%2C%20ce%20vrei%20schimbat%20la%20ton%20sau%20glume%20--%3E

            Ți-a plăcut o frază? Salveaz-o pentru data viitoare: https://github.com/mcandea04/mondial/issues/new?title=gold&labels=gold&body=%3C%21--%20Lipe%C8%99te%20o%20linie%20pe%20r%C3%A2nd.%20Op%C8%9Bional%20pune%20%C3%AEn%20fa%C8%9B%C4%83%20headline%3A%20summary%3A%20pill%3A%20tonight%3A%20-%20altfel%20e%20pill.%20Po%C8%9Bi%20s%C4%83%20o%20rescrii%20%C3%AEn%20cuvintele%20tale.%20--%3E

            ---
            Proză: ${{ steps.build.outputs.narrator }}
