name: Daily digest

on:
  schedule:
    # Poll every 15 min across the EEST night window (19:00–09:00 EEST =
    # 16:00–06:00 UTC). The run is a cheap no-op until every match of the night
    # has finished, so frequent polling just means the digest lands soon after
    # the last final whistle — including knockout extra time and penalties.
    - cron: "*/15 16-23 * * *"
    - cron: "*/15 0-6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if the night's matches are not all finished"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # GitHub forces Node 24 action runtimes from 2026-06-16 (mid-tournament);
      # opt in now so the switch is already verified.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build digest
        id: build
        # Scheduled polls gate on completeness; a manual run without "force"
        # gates too, but force=true (re-run / backfill) skips the gate.
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            node pipeline/run.js
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            node pipeline/run.js --require-complete
          fi
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Unset by default so narrate.js DEFAULT_MODEL stays the single source of
          # truth; set the GEMINI_MODEL repo variable only to override it.
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SITE_URL: https://mcandea04.github.io/mondial/

      - name: Commit digest data
        if: steps.build.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/data site/index.html
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "digest: ${{ steps.build.outputs.date }}"
            git push
          fi

      - uses: actions/configure-pages@v5
        if: steps.build.outputs.published == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: steps.build.outputs.published == 'true'
        with:
          path: site

      - id: deployment
        if: steps.build.outputs.published == 'true'
        uses: actions/deploy-pages@v4

      - name: Email digest ready
        if: steps.build.outputs.published == 'true'
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: Mondial <${{ secrets.MAIL_USERNAME }}>
          to: ${{ secrets.MAIL_TO }}
          subject: "⚽ Mondialul de dimineață — ${{ steps.build.outputs.date }}"
          body: |
            ${{ steps.build.outputs.headline }}

            ${{ steps.build.outputs.match_count }} meciuri azi-noapte.

            Citește digestul: https://mcandea04.github.io/mondial/
